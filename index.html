<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#234c3e" />
    <meta name="description" content="Mola adisyon ve QR menü · Merkut Studios" />
    <meta name="author" content="Merkut Studios" />
    <!-- iPhone/iPad "Ana Ekrana Ekle": opens as its own app window (no Safari bars), named Mola. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mola" />
    <meta name="application-name" content="Mola" />
    <!-- Tab and window icons: pixel-grid 16/32 first (sharp at tab size), the vector one, then the large ones (scripts/mola-icons.mjs).
         The desktop window's taskbar icon comes from Mola.exe (scripts/desktop/Ortak.cs, Taskbar), not from here. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mola · İşletme yönetimi</title>
  </head>
